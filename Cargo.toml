[package]
name = "rex-nvim"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "0.8"
anyhow = "1"
crossterm = "0.28"
fff-search = "=0.10.6"
libc = "0.2"

[profile.release]
lto = true
strip = true
